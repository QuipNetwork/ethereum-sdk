[profile.default]
src = "contracts"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# via_ir is REQUIRED: the SHRINCS verifier (dependency ShrincsForsC.sol) hits stack-too-deep
# under the legacy pipeline. Enabling it project-wide keeps a single build/test command.
# NOTE: this changes WOTSPlus codegen, so the [profile.deploy] WOTSPlus link address below
# must be regenerated via script/PredictAddresses.s.sol before the next on-chain deploy.
via_ir = true
cbor_metadata = false
bytecode_hash = "none"
extra_output = ["abi", "storageLayout"]
extra_output_files = ["abi"]
# CreateX pins solc 0.8.23, so tests load its shipped artifact via vm.getCode
# instead of compiling the source (see test/script/Deploy.t.sol).
fs_permissions = [{ access = "read", path = "dependencies/pcaversaccio-createx-1.0.0/artifacts" }]

# The in-Solidity SHRINCS test signer (dependency test/helpers) is hash- and memory-heavy:
# keygen/stateless signing expand EVM memory far past the defaults (matches the dependency's
# own test config).
gas_limit = "18446744073709551615" # u64::MAX
memory_limit = 1073741824 # 1 GiB

# Invariant fuzz budget — sized for ~2 min local runtime against the WOTSPlusImplementation
# light suite (WOTS+ signing dominates per-call cost). The heavy suite
# (LocalHeavy.t.sol) overrides further via inline `forge-config` annotation.
# Override via env vars (`FOUNDRY_INVARIANT_RUNS=256 FOUNDRY_INVARIANT_DEPTH=500
# forge test ...`) for CI / overnight stress runs.
[invariant]
runs = 20
depth = 200
fail_on_revert = false

[dependencies]
forge-std = "1.14.0"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.6.0-rc.1"
pcaversaccio-createx = { version = "1.0.0", git = "https://github.com/pcaversaccio/createx.git", tag = "v1.0.0" }
"@quip.network/hashsigs-solidity" = { version = "0.2.0", git = "git@gitlab.com:quip.network/hashsigs-solidity.git", rev = "dd6fa9effeff78b8a502ddf8351308739a4522aa" }

# Deploy profile: links WOTSPlus at its CREATE3 address for WOTSPlusImplementation compilation.
# Needed ONLY by the sunset WOTS+ scripts under script/deprecated/ — the live
# 01_DeployFactory / 02_DeployShrincs entrypoints link no libraries.
# Usage: FOUNDRY_PROFILE=deploy forge script ...
# The address below is computed by: forge script script/PredictAddresses.s.sol
[profile.deploy]
libraries = [
    "@quip.network/hashsigs-solidity-0.2.0/contracts/WOTSPlus.sol:WOTSPlus:0x7837b85Fa4D31a5af8FD28e66b18f156F66C3723"
]

[rpc_endpoints]
sepolia = "${API_URL_SEPOLIA}"
base_sepolia = "${API_URL_BASE_SEPOLIA}"
op_sepolia = "${API_URL_OP_SEPOLIA}"
mainnet = "${API_URL_MAINNET}"
base = "${API_URL_BASE}"
optimism = "${API_URL_OPTIMISM}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }
op_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }
