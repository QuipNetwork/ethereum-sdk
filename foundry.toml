[profile.default]
src = "contracts"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.33"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
cbor_metadata = false
bytecode_hash = "none"
extra_output = ["abi", "storageLayout"]
extra_output_files = ["abi"]

# Invariant fuzz budget — sized for ~2 min local runtime against the QuipWallet
# light suite (WOTS+ signing dominates per-call cost). The heavy suite
# (LocalHeavy.t.sol) overrides further via inline `forge-config` annotation.
# Override via env vars (`FOUNDRY_INVARIANT_RUNS=256 FOUNDRY_INVARIANT_DEPTH=500
# forge test ...`) for CI / overnight stress runs.
[invariant]
runs = 20
depth = 200
fail_on_revert = false

[dependencies]
forge-std = "1.14.0"
solady = "0.1.26"
"@openzeppelin-contracts" = "5.6.0-rc.1"
"@quip.network/hashsigs-solidity" = { version = "0.1.0", git = "https://gitlab.com/piqued/hashsigs-solidity.git", branch = "main" }
pcaversaccio-createx = { version = "1.0.0", git = "https://github.com/pcaversaccio/createx.git", tag = "v1.0.0" }

# Deploy profile: links WOTSPlus at its CREATE3 address for QuipWallet compilation.
# Usage: FOUNDRY_PROFILE=deploy forge script ...
# The address below is computed by: forge script script/PredictAddresses.s.sol
[profile.deploy]
libraries = [
    "@quip.network/hashsigs-solidity-0.1.0/contracts/WOTSPlus.sol:WOTSPlus:0x7837b85Fa4D31a5af8FD28e66b18f156F66C3723"
]

[rpc_endpoints]
sepolia = "${API_URL_SEPOLIA}"
base_sepolia = "${API_URL_BASE_SEPOLIA}"
op_sepolia = "${API_URL_OP_SEPOLIA}"
mainnet = "${API_URL_MAINNET}"
base = "${API_URL_BASE}"
optimism = "${API_URL_OPTIMISM}"

[etherscan]
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
optimism = { key = "${ETHERSCAN_API_KEY}", chain = 10 }
op_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }
